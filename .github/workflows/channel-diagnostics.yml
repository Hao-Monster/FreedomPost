name: Channel diagnostics
on:
  push:
    branches: [codex/admin-domain-tls]
    paths: [.github/workflows/channel-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          password: ${{ secrets.DEPLOY_KEY == '' && secrets.DEPLOY_PASSWORD || '' }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            printf 'production_egress_ip='
            curl -4fsS --max-time 5 https://api.ipify.org
            printf '\n'
            sudo docker compose --env-file .env -f deploy/docker-compose.yml ps api-go
            sudo docker compose --env-file .env -f deploy/docker-compose.yml logs --since 30m --no-color --no-log-prefix api-go 2>&1 | python3 -c '
            import sys,json
            for line in sys.stdin:
              try: obj=json.loads(line[line.find("{"):])
              except ValueError: continue
              msg=obj.get("msg", "")
              if any(x in msg for x in ("bridge", "wecom", "chatwoot")):
                print(json.dumps({k:obj[k] for k in ("time","level","msg","reason","error","stage","status","duration_ms","target_host","account_id","conversation_id","auth_header_present","response_kind","edge_present","request_id_present") if k in obj}))
            '
            container_id=$(sudo docker compose --env-file .env -f deploy/docker-compose.yml ps -q api-go)
            sudo docker inspect "$container_id" | python3 -c '
            import sys,json,urllib.request,urllib.error
            obj=json.load(sys.stdin)[0]
            env=dict(item.split("=",1) for item in obj["Config"]["Env"] if "=" in item)
            base=env.get("CHATWOOT_BASE_URL","").rstrip("/")
            token=env.get("CHATWOOT_API_TOKEN","").strip()
            if base != "https://chat.clawpan.online":
              print("chatwoot probe skipped: unexpected origin"); sys.exit(0)
            class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
            opener=urllib.request.build_opener(NoRedirect)
            for stage,path in (("profile","/api/v1/profile"),("account","/api/v1/accounts/1/inboxes")):
              for auth_mode,headers in (("api_access_token",{"api_access_token":token}),("bearer",{"Authorization":"Bearer "+token}),("both",{"api_access_token":token,"Authorization":"Bearer "+token})):
                headers["Accept"]="application/json"
                req=urllib.request.Request(base+path,headers=headers)
                try: response=opener.open(req,timeout=10)
                except urllib.error.HTTPError as error: response=error
                except Exception:
                  print(json.dumps({"stage":stage,"auth_mode":auth_mode,"reason":"transport_error"})); continue
                with response:
                  body=response.read(65536)
                  try: json.loads(body); kind="json"
                  except Exception: kind="non_json"
                  print(json.dumps({"stage":stage,"auth_mode":auth_mode,"status":response.code,"response_kind":kind,"edge_present":bool(response.headers.get("CF-Ray"))}))
            '

