name: Provision origin mTLS

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA at the current protected main HEAD
        required: true
        type: string
      operation:
        description: Inspect, create a server-local health key and public CSR, or install signed public material
        required: true
        type: choice
        options:
          - inspect
          - create-health-csr
          - install-health-material
      ca_base64:
        description: Single public client CA PEM certificate, base64 encoded (install only)
        required: false
        type: string
      health_cert_base64:
        description: Signed public health client PEM certificate, base64 encoded (install only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: freedompost-production-deploy
  cancel-in-progress: false

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authorize exact production revision and public inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          MTLS_OPERATION: ${{ inputs.operation }}
          CA_BASE64: ${{ inputs.ca_base64 }}
          HEALTH_CERT_BASE64: ${{ inputs.health_cert_base64 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RELEASE_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          case "$MTLS_OPERATION" in
            inspect|create-health-csr) test -z "$CA_BASE64$HEALTH_CERT_BASE64" ;;
            install-health-material)
              public_dir=$(mktemp -d)
              trap 'rm -rf -- "$public_dir"' EXIT
              for value in "$CA_BASE64" "$HEALTH_CERT_BASE64"; do
                test "${#value}" -le 32768
                [[ "$value" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
                printf '%s' "$value" | base64 --decode | tr -d '\r' > "$public_dir/cert.pem"
                test "$(grep -c '^-----BEGIN CERTIFICATE-----$' "$public_dir/cert.pem")" = 1
                ! grep -q 'PRIVATE KEY' "$public_dir/cert.pem"
                openssl x509 -in "$public_dir/cert.pem" -noout >/dev/null 2>&1
              done ;;
            *) exit 1 ;;
          esac
      - name: Checkout authorized script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha }}
      - name: Reject stale revision before server access
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
      - name: Provision fixed origin certificate paths
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          MTLS_OPERATION: ${{ inputs.operation }}
          CA_BASE64: ${{ inputs.ca_base64 }}
          HEALTH_CERT_BASE64: ${{ inputs.health_cert_base64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_KEY == '' && secrets.DEPLOY_PASSWORD || '' }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: RELEASE_SHA,MTLS_OPERATION,CA_BASE64,HEALTH_CERT_BASE64
          command_timeout: 3m
          script_path: deploy/provision-origin-mtls.sh
