name: Migrate deployment secrets

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy secrets to deployment repository
        env:
          GH_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
          TARGET_REPO: Hao-Monster/freedompost-chatwoot
          CHATWOOT_API_TOKEN: ${{ secrets.CHATWOOT_API_TOKEN }}
          CHATWOOT_WEBSITE_TOKEN: ${{ secrets.CHATWOOT_WEBSITE_TOKEN }}
          CHATWOOT_WEBHOOK_SECRET: ${{ secrets.CHATWOOT_WEBHOOK_SECRET }}
          CHATWOOT_ACCOUNT_ID: ${{ secrets.CHATWOOT_ACCOUNT_ID }}
          CHATWOOT_INBOX_ID: ${{ secrets.CHATWOOT_INBOX_ID }}
          WECOM_CORP_ID: ${{ secrets.WECOM_CORP_ID }}
          WECOM_CORP_SECRET: ${{ secrets.WECOM_CORP_SECRET }}
          WECOM_AGENT_ID: ${{ secrets.WECOM_AGENT_ID }}
          WECOM_CALLBACK_TOKEN: ${{ secrets.WECOM_CALLBACK_TOKEN }}
          WECOM_ENCODING_AES_KEY: ${{ secrets.WECOM_ENCODING_AES_KEY }}
          WECOM_RECEIVE_ID: ${{ secrets.WECOM_RECEIVE_ID }}
          WECOM_OPERATOR_USER_ID: ${{ secrets.WECOM_OPERATOR_USER_ID }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          VISITOR_HASH_SALT: ${{ secrets.VISITOR_HASH_SALT }}
          PAID_ACCESS_INTERNAL_SECRET: ${{ secrets.PAID_ACCESS_INTERNAL_SECRET }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          PREVIEW_DOMAIN: ${{ secrets.PREVIEW_DOMAIN }}
          ADMIN_DOMAIN: ${{ secrets.ADMIN_DOMAIN }}
          ADMIN_ORIGIN: ${{ secrets.ADMIN_ORIGIN }}
          STORAGE_DRIVER: ${{ secrets.STORAGE_DRIVER }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          OPUS8_INTEGRATION_BASE_URL: ${{ secrets.OPUS8_INTEGRATION_BASE_URL }}
          OPUS8_INTEGRATION_KEY_ID: ${{ secrets.OPUS8_INTEGRATION_KEY_ID }}
          OPUS8_INTEGRATION_SECRET: ${{ secrets.OPUS8_INTEGRATION_SECRET }}
          BENEFIT_CLAIM_HMAC_SECRET: ${{ secrets.BENEFIT_CLAIM_HMAC_SECRET }}
          BENEFIT_LINK_ENCRYPTION_KEY: ${{ secrets.BENEFIT_LINK_ENCRYPTION_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PUBLIC_BASE_URL: ${{ secrets.ALIYUN_OSS_PUBLIC_BASE_URL }}
          ALIYUN_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          names='CHATWOOT_API_TOKEN CHATWOOT_WEBSITE_TOKEN CHATWOOT_WEBHOOK_SECRET CHATWOOT_ACCOUNT_ID CHATWOOT_INBOX_ID WECOM_CORP_ID WECOM_CORP_SECRET WECOM_AGENT_ID WECOM_CALLBACK_TOKEN WECOM_ENCODING_AES_KEY WECOM_RECEIVE_ID WECOM_OPERATOR_USER_ID POSTGRES_PASSWORD REDIS_PASSWORD COOKIE_SECRET VISITOR_HASH_SALT PAID_ACCESS_INTERNAL_SECRET ADMIN_PASSWORD_HASH PREVIEW_DOMAIN ADMIN_DOMAIN ADMIN_ORIGIN STORAGE_DRIVER TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY OPUS8_INTEGRATION_BASE_URL OPUS8_INTEGRATION_KEY_ID OPUS8_INTEGRATION_SECRET BENEFIT_CLAIM_HMAC_SECRET BENEFIT_LINK_ENCRYPTION_KEY R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_PUBLIC_BASE_URL R2_PREFIX ALIYUN_OSS_REGION ALIYUN_OSS_BUCKET ALIYUN_OSS_ENDPOINT ALIYUN_OSS_PUBLIC_BASE_URL ALIYUN_OSS_PREFIX ALIYUN_OSS_ACCESS_KEY_ID ALIYUN_OSS_ACCESS_KEY_SECRET'
          for name in $names; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | gh secret set "$name" --repo "$TARGET_REPO" >/dev/null
            fi
          done
          gh secret set SSH_IP --repo "$TARGET_REPO" --body '120.48.127.61' >/dev/null
          gh secret set SSH_USER --repo "$TARGET_REPO" --body 'root' >/dev/null
          gh secret set SSH_PORT --repo "$TARGET_REPO" --body '22' >/dev/null
          gh secret set DEPLOY_PATH --repo "$TARGET_REPO" --body '/opt/freedompost-chatwoot' >/dev/null
      - name: Remove migration workflow and token
        env:
          GH_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/migrate-secrets.yml
          git commit -m 'chore: remove one-time secret migration workflow'
          git push
          gh secret delete MIGRATION_TOKEN --repo "$GITHUB_REPOSITORY" --yes
