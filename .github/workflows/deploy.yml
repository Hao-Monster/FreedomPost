name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: freedompost-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Setup Go (paid-access)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: services/paid-access/go.mod
          cache-dependency-path: services/paid-access/go.sum

      - name: Setup Go (api-go)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Install dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            npm cache verify || true
            sleep "$((attempt * 15))"
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test --workspaces --if-present

      - name: Test Go paid access service
        working-directory: services/paid-access
        run: go test -race ./...

      - name: Test Go API service
        working-directory: services/api
        run: go test ./internal/domain/... ./internal/ratelimit/... ./internal/renderer/...

      - name: Vet Go API service
        working-directory: services/api
        run: go vet ./...

      - name: Build
        run: |
          npm run build
          mkdir -p services/paid-access/bin
          (cd services/paid-access && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/paid-access ./cmd/server)
          mkdir -p services/api/bin
          (cd services/api && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${{ github.sha }}" -o bin/fp-api ./cmd/server)

      - name: Prepare deploy bundle
        run: |
          rm -rf /tmp/freedompost-deploy
          mkdir -p /tmp/freedompost-deploy
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".agents" \
            --exclude "**/node_modules" \
            --exclude "runtime" \
            --exclude "coverage" \
            --exclude "apps/*/.astro" \
            --exclude "apps/*/src" \
            --exclude "apps/*/public" \
            --exclude "contracts" \
            --exclude "packages" \
            --exclude "services/*/internal" \
            --exclude "services/*/cmd" \
            --exclude "services/*/*.go" \
            --exclude "services/*/go.*" \
            --exclude "docs" \
            --exclude "*.md" \
            --exclude "*.html" \
            --exclude "**/*.test.*" \
            --exclude "**/*_test.go" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "tsconfig*.json" \
            ./ /tmp/freedompost-deploy/
          tar -czf freedompost-deploy.tar.gz -C /tmp/freedompost-deploy .
          # Log bundle size for monitoring
          du -sh freedompost-deploy.tar.gz

      - name: Verify deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          VISITOR_HASH_SALT: ${{ secrets.VISITOR_HASH_SALT }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PAID_ARTICLES_ENABLED: "true"
          PAID_ACCESS_INTERNAL_URL: http://paid-access:8080
          PAID_ACCESS_INTERNAL_SECRET: ${{ secrets.PAID_ACCESS_INTERNAL_SECRET }}
          PREVIEW_DOMAIN: ${{ secrets.PREVIEW_DOMAIN }}
          STORAGE_DRIVER: ${{ secrets.STORAGE_DRIVER }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
          TRUST_PROXY: "true"
          REDIS_URL: redis://:${{ secrets.REDIS_PASSWORD }}@redis:6379
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_EXPECTED_HOSTNAME: ${{ secrets.PREVIEW_DOMAIN }}
          TURNSTILE_EXPECTED_ACTION: webmaster_benefit_claim
          TURNSTILE_TIMEOUT_MS: "3000"
          OPUS8_INTEGRATION_BASE_URL: ${{ secrets.OPUS8_INTEGRATION_BASE_URL }}
          OPUS8_INTEGRATION_KEY_ID: ${{ secrets.OPUS8_INTEGRATION_KEY_ID }}
          OPUS8_INTEGRATION_SECRET: ${{ secrets.OPUS8_INTEGRATION_SECRET }}
          OPUS8_INTEGRATION_TIMEOUT_MS: "5000"
          BENEFIT_CLAIM_HMAC_SECRET: ${{ secrets.BENEFIT_CLAIM_HMAC_SECRET }}
          BENEFIT_LINK_ENCRYPTION_KEY: ${{ secrets.BENEFIT_LINK_ENCRYPTION_KEY }}
          GO_API_WEIGHT: ${{ secrets.GO_API_WEIGHT || '0' }}
          TS_API_WEIGHT: ${{ secrets.TS_API_WEIGHT || '100' }}
          BENEFIT_NETWORK_DAILY_LIMIT: "3"
          BENEFIT_CLAIM_MINUTE_LIMIT: "6"
        run: |
          node deploy/production-preflight.mjs

      - name: Copy bundle to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_KEY == '' && secrets.DEPLOY_PASSWORD || '' }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "freedompost-deploy.tar.gz"
          target: "/tmp"
          rm: false
          timeout: 60s
          command_timeout: 3m

      - name: Deploy over SSH
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          VISITOR_HASH_SALT: ${{ secrets.VISITOR_HASH_SALT }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PAID_ACCESS_INTERNAL_SECRET: ${{ secrets.PAID_ACCESS_INTERNAL_SECRET }}
          PREVIEW_DOMAIN: ${{ secrets.PREVIEW_DOMAIN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          STORAGE_DRIVER: ${{ secrets.STORAGE_DRIVER }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PUBLIC_BASE_URL: ${{ secrets.ALIYUN_OSS_PUBLIC_BASE_URL }}
          ALIYUN_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          OPUS8_INTEGRATION_BASE_URL: ${{ secrets.OPUS8_INTEGRATION_BASE_URL }}
          OPUS8_INTEGRATION_KEY_ID: ${{ secrets.OPUS8_INTEGRATION_KEY_ID }}
          OPUS8_INTEGRATION_SECRET: ${{ secrets.OPUS8_INTEGRATION_SECRET }}
          BENEFIT_CLAIM_HMAC_SECRET: ${{ secrets.BENEFIT_CLAIM_HMAC_SECRET }}
          BENEFIT_LINK_ENCRYPTION_KEY: ${{ secrets.BENEFIT_LINK_ENCRYPTION_KEY }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          GO_API_WEIGHT: ${{ secrets.GO_API_WEIGHT || '0' }}
          TS_API_WEIGHT: ${{ secrets.TS_API_WEIGHT || '100' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_KEY == '' && secrets.DEPLOY_PASSWORD || '' }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,COOKIE_SECRET,VISITOR_HASH_SALT,ADMIN_PASSWORD,POSTGRES_PASSWORD,PAID_ACCESS_INTERNAL_SECRET,PREVIEW_DOMAIN,DEPLOY_HOST,STORAGE_DRIVER,ALIYUN_OSS_REGION,ALIYUN_OSS_BUCKET,ALIYUN_OSS_ENDPOINT,ALIYUN_OSS_PUBLIC_BASE_URL,ALIYUN_OSS_PREFIX,ALIYUN_OSS_ACCESS_KEY_ID,ALIYUN_OSS_ACCESS_KEY_SECRET,R2_ACCOUNT_ID,R2_BUCKET,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_ENDPOINT,R2_PUBLIC_BASE_URL,R2_PREFIX,TURNSTILE_SITE_KEY,TURNSTILE_SECRET_KEY,OPUS8_INTEGRATION_BASE_URL,OPUS8_INTEGRATION_KEY_ID,OPUS8_INTEGRATION_SECRET,BENEFIT_CLAIM_HMAC_SECRET,BENEFIT_LINK_ENCRYPTION_KEY,REDIS_PASSWORD,GO_API_WEIGHT,TS_API_WEIGHT
          command_timeout: 10m
          script_path: deploy/remote-deploy.sh


