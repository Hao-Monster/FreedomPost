networks:
  # [H2] Separate frontend (public-facing) and backend (data) networks.
  # nginx/api-go/paid-access can reach each other via frontend.
  # postgres/redis are only reachable from backend — not from nginx.
  frontend:
    driver: bridge
  backend:
    driver: bridge

services:
  nginx:
    build:
      context: ..
      dockerfile: Dockerfile
      target: nginx
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://example.com}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-https://example.com}
    env_file:
      - ../.env
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-go
      - paid-access
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    networks:
      - frontend

  # Go API — the sole API backend after full cutover from TypeScript API
  api-go:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
      target: api-go-runtime
      args:
        VERSION: ${IMAGE_TAG:-dev}
    env_file:
      - ../.env
    environment:
      PORT: "3000"
      TRUST_PROXY: "true"
    depends_on:
      - postgres
      - redis
      - paid-access
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/fp-api", "-health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend
      - backend

  paid-access:
    build:
      context: ..
      dockerfile: Dockerfile
      target: paid-access-runtime
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freedompost}
      POSTGRES_USER: ${POSTGRES_USER:-freedompost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # [H2] postgres only reachable from backend network — not from nginx
    networks:
      - backend

  # [M5] Redis with password authentication.
  # Set REDIS_PASSWORD in .env and update REDIS_URL accordingly.
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redisdata:/data
    # [H2] redis only reachable from backend network — not from nginx
    networks:
      - backend

volumes:
  caddydata:
  caddyconfig:
  pgdata:
  redisdata:
